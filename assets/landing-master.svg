<circle cx="417" cy="1078" r="48" fill="#eafbf2"/>
<path d="M399 1089 h36 M403 1084 v-20 a14 14 0 0 1 28 0 v20 l6 8 H397z M411 1098 q6 9 12 0" fill="none" stroke="#0bb56b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="467" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#0a245b">Attiva</text><text x="467" y="1084" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#0a245b">notifiche</text>
<text x="467" y="1117" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#71839a">Scegli quali</text><text x="467" y="1139" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#71839a">notifiche vuoi attivare</text>
<path d="M623 1067 l12 11 -12 11" fill="none" stroke="#0bb56b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

