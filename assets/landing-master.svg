<path d="M-20 1164 C120 1128 225 1192 350 1171 C493 1148 582 1155 716 1185" fill="none" stroke="#51b8ee" stroke-width="22" opacity=".10"/>
<path d="M-20 1198 C150 1168 270 1215 410 1192 C540 1171 620 1188 720 1212" fill="none" stroke="#55c4ef" stroke-width="34" opacity=".09"/>
