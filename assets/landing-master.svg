<svg xmlns="http://www.w3.org/2000/svg" width="691" height="1229" viewBox="0 0 691 1229">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f9fdff"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
  <linearGradient id="blueBtn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18b7ff"/><stop offset="1" stop-color="#087df5"/></linearGradient>
  <linearGradient id="greenBtn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18d48a"/><stop offset="1" stop-color="#09ad63"/></linearGradient>
  <radialGradient id="bubBlue"><stop stop-color="#66d8ff"/><stop offset="1" stop-color="#0d8cf3"/></radialGradient>
  <radialGradient id="bubGreen"><stop stop-color="#7ff0bf"/><stop offset="1" stop-color="#14b66f"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1c5577" flood-opacity=".16"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  <clipPath id="rbBlue"><rect x="0" y="0" width="180" height="180" rx="34"/></clipPath>
  <clipPath id="rbGreen"><rect x="0" y="0" width="180" height="180" rx="34"/></clipPath>
</defs>

<rect width="691" height="1229" fill="url(#bg)"/>

<!-- luminous background -->
<ellipse cx="520" cy="115" rx="220" ry="118" fill="#5bc8ff" opacity=".10"/>
<ellipse cx="527" cy="125" rx="185" ry="96" fill="none" stroke="#6bcfff" stroke-width="18" opacity=".10" transform="rotate(-14 527 125)"/>
<ellipse cx="521" cy="130" rx="150" ry="72" fill="none" stroke="#42baf7" stroke-width="8" opacity=".12" transform="rotate(-14 521 130)"/>
<path d="M300 0 C440 55 530 92 690 24" fill="none" stroke="#44b9f2" stroke-width="42" opacity=".08"/>
<path d="M310 25 C460 102 540 113 690 66" fill="none" stroke="#29c99f" stroke-width="28" opacity=".06"/>
<path d="M-20 42 C124 76 186 106 250 174" fill="none" stroke="#6ecbfa" stroke-width="26" opacity=".05"/>
<circle cx="285" cy="89" r="23" fill="url(#bubBlue)" opacity=".28"/>
<circle cx="432" cy="69" r="16" fill="url(#bubBlue)" opacity=".95"/>
<circle cx="522" cy="308" r="17" fill="url(#bubBlue)" opacity=".85"/>

<!-- title -->
<text x="45" y="140" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" fill="#06185d">In</text>
<text x="44" y="202" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" fill="#1187ef">Ordine</text>
<path d="M237 114 l8 -23 M267 119 l22 -16" stroke="#1187ef" stroke-width="7" stroke-linecap="round"/>
<text x="45" y="235" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#34485f">Conti e attività,</text>
<text x="45" y="267" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#34485f">tutto sotto controllo.</text>
<text x="45" y="318" font-family="'Segoe Script','Brush Script MT',cursive" font-size="28" font-style="italic" font-weight="700" fill="#118ee8">Più tempo</text>
<text x="45" y="349" font-family="'Segoe Script','Brush Script MT',cursive" font-size="28" font-style="italic" font-weight="700" fill="#118ee8">per ciò che conta</text>
<path d="M244 326 C235 313 218 315 218 330 C218 344 244 358 244 358 C244 358 271 343 271 329 C271 314 252 313 244 326Z" fill="none" stroke="#118ee8" stroke-width="4"/>

<!-- hero logos -->
<g transform="translate(425 86) rotate(5 82 82)" filter="url(#shadow)"><image href="eds-green.webp" x="0" y="0" width="164" height="164" preserveAspectRatio="xMidYMid slice" clip-path="url(#rbGreen)"/></g>
<g transform="translate(339 117) rotate(3 90 90)" filter="url(#shadow)"><image href="eds-blue.webp" x="0" y="0" width="180" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#rbBlue)"/></g>

<!-- name card -->
<rect x="33" y="377" width="625" height="137" rx="24" fill="#ffffff" filter="url(#shadow)"/>
<text x="52" y="420" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="900" fill="#07185b">Come vuoi essere chiamato?</text>
<rect x="52" y="435" width="587" height="61" rx="15" fill="#fff" stroke="#0f92ee" stroke-width="4"/>

<!-- choose -->
<text x="178" y="556" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="900" fill="#07185b">Scegli da dove iniziare.</text>

<!-- main cards -->
<rect x="31" y="580" width="306" height="386" rx="27" fill="#fff" stroke="#1bb9e8" stroke-width="3"/>
<circle cx="181" cy="673" r="112" fill="#eefaff"/>
<circle cx="80" cy="676" r="14" fill="#64cff9" opacity=".42"/><circle cx="102" cy="718" r="27" fill="#5fc8f4" opacity=".24"/><circle cx="289" cy="723" r="23" fill="#5fc8f4" opacity=".18"/>
<image href="eds-blue.webp" x="125" y="615" width="126" height="126" preserveAspectRatio="xMidYMid slice"/>
<text x="184" y="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#07185b">Conti</text>
<text x="184" y="817" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#07185b">economici</text>
<text x="184" y="855" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#556d86">Monitora entrate,</text>
<text x="184" y="882" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#556d86">pagamenti e saldo.</text>
<circle cx="184" cy="923" r="39" fill="url(#blueBtn)"/><path d="M168 923 h31 M188 910 l13 13 -13 13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="354" y="580" width="306" height="386" rx="27" fill="#fff" stroke="#35ca88" stroke-width="3"/>
<circle cx="507" cy="673" r="112" fill="#effcf5"/>
<circle cx="408" cy="676" r="14" fill="#55d99b" opacity=".38"/><circle cx="628" cy="718" r="29" fill="#55d99b" opacity=".20"/>
<image href="eds-green.webp" x="448" y="615" width="126" height="126" preserveAspectRatio="xMidYMid slice"/>
<text x="507" y="796" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="900" fill="#083c2f">Cose da fare</text>
<text x="507" y="846" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#556d86">Organizza impegni,</text>
<text x="507" y="873" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#556d86">scadenze e promemoria.</text>
<circle cx="507" cy="923" r="39" fill="url(#greenBtn)"/><path d="M491 923 h31 M511 910 l13 13 -13 13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- notification cards -->
<rect x="31" y="1012" width="306" height="135" rx="25" fill="#fff" stroke="#c6e8f7" stroke-width="2" filter="url(#shadow)"/>
<circle cx="94" cy="1078" r="48" fill="#e9f8ff"/>
