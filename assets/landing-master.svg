<text x="144" y="1117" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#71839a">Scegli quali</text><text x="144" y="1139" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#71839a">notifiche vuoi attivare</text>
