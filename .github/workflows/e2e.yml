name: Test app flows
on:
  push:
    branches: [main, rebuild-conti-economici]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/inordine-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Run regression tests
        run: node tests/e2e.mjs
