name: Android APK
on:
  push:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Prepare V2 web bundle
        run: npm run build:v2
      - name: Create Android project
        run: |
          test -f android/app/src/main/java/it/inordine/app/MainActivity.java
          npx cap sync android
      - name: Require persistent APK signing key
        env:
          INORDINE_SIGNING_KEYSTORE_BASE64: ${{ secrets.INORDINE_SIGNING_KEYSTORE_BASE64 }}
          INORDINE_SIGNING_STORE_PASSWORD: ${{ secrets.INORDINE_SIGNING_STORE_PASSWORD }}
          INORDINE_SIGNING_KEY_ALIAS: ${{ secrets.INORDINE_SIGNING_KEY_ALIAS }}
          INORDINE_SIGNING_KEY_PASSWORD: ${{ secrets.INORDINE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$INORDINE_SIGNING_KEYSTORE_BASE64" ] || [ -z "$INORDINE_SIGNING_STORE_PASSWORD" ] || [ -z "$INORDINE_SIGNING_KEY_ALIAS" ] || [ -z "$INORDINE_SIGNING_KEY_PASSWORD" ]; then
            echo "::error title=Persistent APK signing key required::Configure all INORDINE_SIGNING_* repository secrets before building an installable APK."
            exit 1
          fi
          signing_key="$RUNNER_TEMP/in-ordine-stable-signing.jks"
          printf '%s' "$INORDINE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_key"
          chmod 600 "$signing_key"
          keytool -list -keystore "$signing_key" -storepass "$INORDINE_SIGNING_STORE_PASSWORD" -alias "$INORDINE_SIGNING_KEY_ALIAS" >/dev/null
          echo "INORDINE_SIGNING_KEYSTORE_PATH=$signing_key" >> "$GITHUB_ENV"
          echo "INORDINE_SIGNING_STORE_PASSWORD=$INORDINE_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "INORDINE_SIGNING_KEY_ALIAS=$INORDINE_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "INORDINE_SIGNING_KEY_PASSWORD=$INORDINE_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Build firma APK con la chiave persistente dei repository secrets." >> "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK and persistent signing certificate
        env:
          INORDINE_SIGNING_KEYSTORE_PATH: ${{ env.INORDINE_SIGNING_KEYSTORE_PATH }}
          INORDINE_SIGNING_STORE_PASSWORD: ${{ env.INORDINE_SIGNING_STORE_PASSWORD }}
          INORDINE_SIGNING_KEY_ALIAS: ${{ env.INORDINE_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose "$apk"
          apk_cert=$("$apksigner" verify --print-certs "$apk" | grep -Eo '[A-Fa-f0-9]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')
          key_cert=$(keytool -exportcert -keystore "$INORDINE_SIGNING_KEYSTORE_PATH" -storepass "$INORDINE_SIGNING_STORE_PASSWORD" -alias "$INORDINE_SIGNING_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          if [ "$apk_cert" != "$key_cert" ]; then
            echo "::error title=APK signing certificate mismatch::The APK was not signed with the configured persistent keystore."
            exit 1
          fi
          echo "Certificato APK SHA-256: $apk_cert" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify merged Android notification permissions and reboot receiver
        run: node tests/verify-android-notifications-manifest.mjs android/app/build/intermediates/merged_manifest/debug
      - name: Verify packaged launcher icon
        run: node tests/verify-android-icon.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
