name: Android APK
on:
  push:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Prepare V2 web bundle
        run: npm run build:v2
      - name: Create Android project
        run: |
          test -f android/app/src/main/java/it/inordine/app/MainActivity.java
          npx cap sync android
      - name: Configure persistent APK signing key when repository secrets are available
        env:
          INORDINE_SIGNING_KEYSTORE_BASE64: ${{ secrets.INORDINE_SIGNING_KEYSTORE_BASE64 }}
          INORDINE_SIGNING_STORE_PASSWORD: ${{ secrets.INORDINE_SIGNING_STORE_PASSWORD }}
          INORDINE_SIGNING_KEY_ALIAS: ${{ secrets.INORDINE_SIGNING_KEY_ALIAS }}
          INORDINE_SIGNING_KEY_PASSWORD: ${{ secrets.INORDINE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$INORDINE_SIGNING_KEYSTORE_BASE64" ] && [ -n "$INORDINE_SIGNING_STORE_PASSWORD" ] && [ -n "$INORDINE_SIGNING_KEY_ALIAS" ] && [ -n "$INORDINE_SIGNING_KEY_PASSWORD" ]; then
            signing_key="$RUNNER_TEMP/in-ordine-stable-signing.jks"
            printf '%s' "$INORDINE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_key"
            echo "INORDINE_SIGNING_KEYSTORE_PATH=$signing_key" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_STORE_PASSWORD=$INORDINE_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_KEY_ALIAS=$INORDINE_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_KEY_PASSWORD=$INORDINE_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Build firma APK: chiave persistente dei repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "INORDINE_SIGNING_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "Build firma APK: chiave debug temporanea del runner; gli APK di esecuzioni diverse potrebbero non aggiornarsi tra loro." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Stable APK signing key is not configured::Add INORDINE_SIGNING_KEYSTORE_BASE64, INORDINE_SIGNING_STORE_PASSWORD, INORDINE_SIGNING_KEY_ALIAS, and INORDINE_SIGNING_KEY_PASSWORD as repository secrets to enable stable updates."
          fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify merged Android notification permissions and reboot receiver
        run: node tests/verify-android-notifications-manifest.mjs android/app/build/intermediates/merged_manifest/debug
      - name: Verify packaged launcher icon
        run: node tests/verify-android-icon.mjs
      - name: Compare APK signing certificate with builds #301 and #299
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_apk=android/app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          new_info=$("$apksigner" verify --print-certs "$new_apk" 2>&1 || true)
          new_cert=$(printf '%s\\n' "$new_info" | grep -Eo '[A-Fa-f0-9]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -z "$new_cert" ]; then
            new_cert=$(keytool -printcert -jarfile "$new_apk" 2>&1 | grep -Eo '([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          fi
          echo "APK candidato #${{ github.run_number }} certificate SHA-256: ${new_cert:-UNAVAILABLE}"
          for build in "301:39334011757" "299:39290686127"; do
            number=${build%%:*}
            run_id=${build##*:}
            prior_dir="$RUNNER_TEMP/in-ordine-run-$number"
            mkdir -p "$prior_dir"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name in-ordine-android-debug-apk --dir "$prior_dir"; then
              echo "Firma APK #$number non verificata; non installare sopra quella versione finché la compatibilità non è confermata." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=APK signing compatibility unknown::Could not retrieve APK #$number."
              continue
            fi
            prior_apk=$(find "$prior_dir" -type f -name '*.apk' -print -quit)
            prior_info=$("$apksigner" verify --print-certs "$prior_apk" 2>&1 || true)
            prior_cert=$(printf '%s\\n' "$prior_info" | grep -Eo '[A-Fa-f0-9]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
            if [ -z "$prior_cert" ]; then
              prior_cert=$(keytool -printcert -jarfile "$prior_apk" 2>&1 | grep -Eo '([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
            fi
            if [ -z "$new_cert" ] || [ -z "$prior_cert" ]; then
              echo "Firma APK #$number non verificabile; non installare sopra quella versione." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=APK signing compatibility unknown::Could not read both certificate fingerprints for build #$number."
            elif [ "$prior_cert" = "$new_cert" ]; then
              echo "Firma APK #$number compatibile con #${{ github.run_number }} (SHA-256 $new_cert)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Firma APK #$number NON compatibile con #${{ github.run_number }}. Non installare sopra la versione #$number: l'aggiornamento Android sarà rifiutato." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=APK signing mismatch::The candidate APK cannot update build #$number without a matching signing key."
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
