name: Android APK
on:
  push:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Prepare V2 web bundle
        run: npm run build:v2
      - name: Create Android project
        run: |
          test -f android/app/src/main/java/it/inordine/app/MainActivity.java
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify packaged launcher icon
        run: node tests/verify-android-icon.mjs
      - name: Compare signing certificate with installed build #198
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in-ordine-run198
          if ! gh run download 37811515287 --repo "$GITHUB_REPOSITORY" --name in-ordine-android-debug-apk --dir /tmp/in-ordine-run198; then
            echo "Firma APK #198: verifica non riuscita; non disinstallare l'app esistente." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=APK signing compatibility unknown::Could not retrieve the APK installed from run #198."
            exit 0
          fi
          old_apk=$(find /tmp/in-ordine-run198 -type f -name '*.apk' -print -quit)
          new_apk=android/app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          echo "Downloaded prior APK path: ${old_apk:-UNAVAILABLE}"
          echo "Candidate APK path: $new_apk"
          echo "apksigner path: $apksigner"
          old_info=$("$apksigner" verify --print-certs "$old_apk" 2>&1 || true)
          new_info=$("$apksigner" verify --print-certs "$new_apk" 2>&1 || true)
          printf 'Run #198 apksigner output:\\n%s\\n' "$old_info"
          printf 'Candidate apksigner output:\\n%s\\n' "$new_info"
          old_cert=$(printf '%s\\n' "$old_info" | grep -Eo '[A-Fa-f0-9]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
          new_cert=$(printf '%s\\n' "$new_info" | grep -Eo '[A-Fa-f0-9]{64}' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -z "$old_cert" ]; then
            old_cert=$(keytool -printcert -jarfile "$old_apk" 2>&1 | grep -Eo '([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          fi
          if [ -z "$new_cert" ]; then
            new_cert=$(keytool -printcert -jarfile "$new_apk" 2>&1 | grep -Eo '([A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          fi
          echo "Run #198 certificate SHA-256: ${old_cert:-UNAVAILABLE}"
          echo "Candidate certificate SHA-256: ${new_cert:-UNAVAILABLE}"
          if [ -z "$old_cert" ] || [ -z "$new_cert" ]; then
            echo "Firma APK #198: non verificata; non disinstallare l'app esistente." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=APK signing compatibility unknown::Could not read both APK signing certificates."
          elif [ "$old_cert" = "$new_cert" ]; then
            echo "Firma APK #198: compatibile con l'APK candidato #${{ github.run_number }}. Certificato SHA-256: $new_cert" >> "$GITHUB_STEP_SUMMARY"
            echo "APK signing certificate matches installed run #198."
          else
            echo "Firma APK #198: NON compatibile con l'APK candidato #${{ github.run_number }}. Non disinstallare l'app esistente: i dati locali potrebbero essere rimossi." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=APK signing mismatch::The new APK cannot update the app signed by run #198. Do not uninstall the existing app."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
