name: Android APK
on:
  push:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Prepare V2 web bundle
        run: npm run build:v2
      - name: Create isolated In Ordine TEST project
        run: |
          test -f android/app/src/main/java/it/inordine/app/MainActivity.java
          npx cap sync android
      - name: Configure persistent signing key or use CI debug signing
        id: configure-signing
        env:
          INORDINE_SIGNING_KEYSTORE_BASE64: ${{ secrets.INORDINE_SIGNING_KEYSTORE_BASE64 }}
          INORDINE_SIGNING_STORE_PASSWORD: ${{ secrets.INORDINE_SIGNING_STORE_PASSWORD }}
          INORDINE_SIGNING_KEY_ALIAS: ${{ secrets.INORDINE_SIGNING_KEY_ALIAS }}
          INORDINE_SIGNING_KEY_PASSWORD: ${{ secrets.INORDINE_SIGNING_KEY_PASSWORD }}
          INORDINE_TEST_VERSION_CODE: ${{ vars.INORDINE_TEST_VERSION_CODE }}
        run: |
          set -euo pipefail
          if [ -z "$INORDINE_SIGNING_KEYSTORE_BASE64" ] && [ -z "$INORDINE_SIGNING_STORE_PASSWORD" ] && [ -z "$INORDINE_SIGNING_KEY_ALIAS" ] && [ -z "$INORDINE_SIGNING_KEY_PASSWORD" ]; then
            echo "SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"
            echo "signing_mode=ephemeral-debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=TEST-only debug signature::This disposable debug-signed APK is uploaded only for In Ordine TEST. Its certificate can change between runs; uninstall the previous TEST app before installing a later build. It cannot update the original app."
            echo "Firma debug CI temporanea: APK installabile caricato solo per In Ordine TEST. Il certificato può cambiare tra le build: per aggiornare una build precedente può essere necessario disinstallare e reinstallare TEST. Non riguarda l'app originale e non è una firma per distribuzione definitiva." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$INORDINE_SIGNING_KEYSTORE_BASE64" ] || [ -z "$INORDINE_SIGNING_STORE_PASSWORD" ] || [ -z "$INORDINE_SIGNING_KEY_ALIAS" ] || [ -z "$INORDINE_SIGNING_KEY_PASSWORD" ]; then
              echo "::error title=Incomplete signing configuration::Configure all four signing secrets or remove them all to use CI debug signing."
              exit 1
            fi
            if ! [[ "$INORDINE_TEST_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=Missing TEST version code::Set repository variable INORDINE_TEST_VERSION_CODE to the next positive version code before enabling persistent APK artifacts."
              exit 1
            fi
            signing_key="$RUNNER_TEMP/in-ordine-signing.jks"
            printf '%s' "$INORDINE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_key"
            chmod 600 "$signing_key"
            keytool -list -keystore "$signing_key" -storepass "$INORDINE_SIGNING_STORE_PASSWORD" -alias "$INORDINE_SIGNING_KEY_ALIAS" >/dev/null
            echo "INORDINE_SIGNING_KEYSTORE_PATH=$signing_key" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_STORE_PASSWORD=$INORDINE_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_KEY_ALIAS=$INORDINE_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INORDINE_SIGNING_KEY_PASSWORD=$INORDINE_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
            echo "signing_mode=persistent" >> "$GITHUB_OUTPUT"
          fi
      - name: Build In Ordine TEST debug APK
        working-directory: android
        env:
          INORDINE_DRIVE_BACKUP_ENABLED: ${{ vars.INORDINE_DRIVE_BACKUP_ENABLED }}
          INORDINE_TEST_VERSION_CODE: ${{ vars.INORDINE_TEST_VERSION_CODE }}
        run: ./gradlew assembleQaDebug
      - name: Verify APK signature
        env:
          SIGNING_MODE: ${{ steps.configure-signing.outputs.signing_mode }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/qa/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose "$apk"
          apk_cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ' :\r' | tr '[:lower:]' '[:upper:]')
          if [ "${SIGNING_MODE:-}" = "persistent" ]; then
            key_cert=$(keytool -exportcert -keystore "$INORDINE_SIGNING_KEYSTORE_PATH" -storepass "$INORDINE_SIGNING_STORE_PASSWORD" -alias "$INORDINE_SIGNING_KEY_ALIAS" | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
            if [ "$apk_cert" != "$key_cert" ]; then
              echo "::error title=APK signature mismatch::The APK certificate does not match the configured persistent key."
              exit 1
            fi
            echo "APK firmato con la chiave persistente configurata ($apk_cert)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firma debug temporanea verificata con apksigner. Certificato CI: $apk_cert. APK TEST-only; per build future potrebbe servire reinstallare In Ordine TEST." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify merged Android notification permissions and reboot receiver
        run: node tests/verify-android-notifications-manifest.mjs android/app/build/intermediates/merged_manifest/qaDebug
      - name: Verify packaged launcher icon
        run: node tests/verify-android-icon.mjs "$(find android/app/build/outputs/apk/qa/debug -maxdepth 1 -type f -name '*.apk' -print -quit)" it.inordine.app.test "In Ordine TEST"
      - name: Verify isolated TEST app configuration
        run: node tests/android-test-app-contract.mjs
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request' && steps.configure-signing.outcome == 'success'
        with:
          name: in-ordine-test-android-debug-apk
          path: android/app/build/outputs/apk/qa/debug/*.apk
          if-no-files-found: error
          retention-days: 14
