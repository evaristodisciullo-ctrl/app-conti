name: Android APK
on:
  push:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Prepare V2 web bundle
        run: npm run build:v2
      - name: Create Android project
        run: |
          test -f android/app/src/main/java/it/inordine/app/MainActivity.java
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose "$apk"
          cert_output=$("$apksigner" verify --print-certs "$apk")
          cert_line=$(printf '%s\n' "$cert_output" | grep 'Signer #1 certificate SHA-256 digest:')
          test -n "$cert_line"
          apk_cert=${cert_line##*: }
          [[ "$apk_cert" =~ ^[A-Fa-f0-9]{64}$ ]]
          echo "Certificato APK SHA-256: $apk_cert" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify merged Android notification permissions and reboot receiver
        run: node tests/verify-android-notifications-manifest.mjs android/app/build/intermediates/merged_manifest/debug
      - name: Verify packaged launcher icon
        run: node tests/verify-android-icon.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
