name: V2 rendered screens
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v2
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-v2-rendered-preview
          path: /tmp/in-ordine-v2-preview/*.png
          if-no-files-found: error
