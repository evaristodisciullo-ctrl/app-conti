name: Visual review
on:
  workflow_dispatch:
  push:
    branches: [main, rebuild-conti-economici, visual-allineamento-grafiche]
  pull_request:
    branches: [main]
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          python3 -m http.server 4173 >/tmp/inordine-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Capture approved runtime screens
        run: |
          mkdir -p visual
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:764},deviceScaleFactor:1672/764});
            await page.clock.setFixedTime(new Date('2026-10-06T12:00:00.000Z'));
            const shot=async(name)=>{await page.evaluate(()=>window.scrollTo(0,0));await page.screenshot({path:'visual/'+name+'.png',fullPage:false,animations:'disabled'})};
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>localStorage.clear());await page.reload();
            await page.waitForSelector('#landing:not(.hidden)');
            await page.fill('#landingNickname','Eva');
            await page.waitForSelector('#landingCanonicalImage[data-loaded="1"]',{state:'attached',timeout:15000});
            await shot('01-in-ordine');
            await page.click('#landingConti');await page.waitForSelector('#setup:not(.hidden)');await shot('02-saldo-iniziale');
            await page.fill('#startBalance','1000');await page.click('#startBtn');await page.waitForSelector('#setupIncome:not(.hidden)');
            { const rows=page.locator('#incomeRows .entryRow'); while(await rows.count()<3) await page.click('#addIncomeSetup'); const samples=[['Stipendio','1500','01/10/2026'],['Rimborso spese','320','15/10/2026'],['Affitto immobile','750','20/10/2026']]; for(let i=0;i<samples.length;i++){const row=rows.nth(i);await row.locator('.rName').fill(samples[i][0]);await row.locator('.rAmount').fill(samples[i][1]);await row.locator('.rDateText').fill(samples[i][2]);} await page.evaluate(()=>document.activeElement.blur()); }
            await shot('03-entrate-primo-inserimento');
            await page.evaluate(()=>document.querySelector('#skipIncomeSetup').click());await page.waitForSelector('#setupExpense:not(.hidden)');
            { const rows=page.locator('#expenseRows .entryRow'); while(await rows.count()<3) await page.click('#addExpenseSetup'); const samples=[['Affitto sede','750','05/10/2026'],['Internet','89','20/10/2026'],['Energia','128,50','10/10/2026']]; for(let i=0;i<samples.length;i++){const row=rows.nth(i);await row.locator('.rName').fill(samples[i][0]);await row.locator('.rAmount').fill(samples[i][1]);await row.locator('.rDateText').fill(samples[i][2]);} await page.evaluate(()=>document.activeElement.blur()); }
            await shot('04-pagamenti-primo-inserimento');
            await page.evaluate(()=>document.querySelector('#skipExpenseSetup').click());await page.waitForSelector('#home:not(.hidden)');

            const today=new Date().toISOString().slice(0,10),ym=today.slice(0,7);
            const dateFor=d=>ym+'-'+String(d).padStart(2,'0');
            await page.evaluate(({ym})=>{
              const dateFor=d=>ym+'-'+String(d).padStart(2,'0');
              const key='inOrdineContiV1',s=JSON.parse(localStorage.getItem(key));
              const entry=(id,type,name,amount,day,category)=>({id,type,name,amount,day,dateSpec:{kind:'day',iso:dateFor(day)},recurrence:{kind:'monthly',startMonth:ym},category,notify:false,note:'',notifyRule:null});
              s.entries=[
                entry('i1','income','Stipendio',1500,1,'Lavoro'),entry('i2','income','Rimborso spese',320,15,'Rimborsi'),
                entry('i3','income','Affitto immobile',750,20,'Affitti'),entry('i4','income','Interessi bancari',45,28,'Altro'),
                entry('e1','expense','Fornitore Rossi S.r.l.',450,5,'Casa'),entry('e2','expense','Utenza Energia',128.5,10,'Bollette'),
                entry('e3','expense','Affitto Sede',750,10,'Casa'),entry('e4','expense','Servizi Internet',89,10,'Bollette')
              ];
              s.history=[
                {id:'h1',entryId:'i1',type:'income',name:'Stipendio',amount:1500,date:dateFor(1),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Lavoro',note:''},
                {id:'h2',entryId:'sample-rimborso',type:'income',name:'Rimborso spese',amount:320,date:dateFor(2),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Rimborsi',note:''},
                {id:'h3',entryId:'sample-fornitore',type:'expense',name:'Fornitore Rossi S.r.l.',amount:450,date:dateFor(2),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Casa',note:''},
                {id:'h4',entryId:'sample-energia',type:'expense',name:'Utenza Energia',amount:128.5,date:dateFor(3),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Bollette',note:''},
                {id:'h5',entryId:'sample-spesa',type:'expense',name:'Spesa supermercato',amount:52.38,date:dateFor(3),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Spesa',note:''},
                {id:'h6',entryId:'sample-interessi',type:'income',name:'Interessi bancari',amount:45,date:dateFor(3),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Altro',note:''},
                {id:'h7',entryId:'i3',type:'income',name:'Affitto immobile',amount:750,date:dateFor(20),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Affitti',note:''},
                {id:'h8',entryId:'i4',type:'income',name:'Interessi bancari',amount:45,date:dateFor(28),month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Altro',note:''}
              ];
              s.customCategories={income:['Interessi'],expense:['Spesa','Trasporti','Svago']};
              s.budgets={Casa:750,Bollette:180,Spesa:300,Trasporti:120,Svago:100,Salute:80};
              s.budgetPlans=[{effectiveMonth:ym,total:1600,limits:{Casa:750,Bollette:180,Spesa:300,Trasporti:120,Svago:100,Salute:80}}];
              s.balance=1197.50;s.setupDone=true;s.setupStage='done';localStorage.setItem(key,JSON.stringify(s));
            },{ym});
            await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');await shot('05-home-conti');
            const octoberState=await page.evaluate(()=>localStorage.getItem('inOrdineContiV1'));
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.history=s.history.filter(x=>x.type==='expense'||x.id==='h1');localStorage.setItem(k,JSON.stringify(s))});
            await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');await page.click('#homeIncome');await page.waitForSelector('#flow:not(.hidden)');await shot('06-elenco-entrate');
            await page.click('#flowBack');await page.evaluate(({ym})=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.history=s.history.filter(x=>x.type==='income');s.history.push({id:'flow-affitto-paid',entryId:'e3',type:'expense',name:'Affitto Sede',amount:750,date:ym+'-06',month:ym,occurrenceMonth:ym,occurrenceKey:ym,category:'Casa',note:''});localStorage.setItem(k,JSON.stringify(s))},{ym});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');await page.click('#homeExpense');await page.waitForSelector('#flow:not(.hidden)');await shot('07-elenco-pagamenti');
            await page.click('#flowBack');await page.evaluate(raw=>localStorage.setItem('inOrdineContiV1',raw),octoberState);await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');await page.clock.setFixedTime(new Date('2025-03-13T12:00:00.000Z'));await page.click('#homeIncome');await page.click('#flowAdd');await page.waitForSelector('#modal:not(.hidden)');await page.locator('#editDateText').fill('25/03/2025');await page.check('#editMarkDone');await page.evaluate(()=>document.activeElement.blur());await shot('08-nuova-entrata');await page.click('#modalClose');
            await page.click('#flowBack');await page.click('#homeExpense');await page.click('#flowAdd');await page.waitForSelector('#modal:not(.hidden)');await page.check('#editMarkDone');await shot('09-nuovo-pagamento');await page.click('#modalClose');
            await page.click('#flowBack');
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.entries=[
              {id:'m-pending-income',type:'income',name:'Cliente Rossi',amount:349,day:10,dateSpec:{kind:'day',iso:'2025-03-10'},category:'Lavoro',recurrence:{kind:'single'},notify:false,note:''},
              {id:'m-pending-expense',type:'expense',name:'Fattura n. 55/2025',amount:780,day:8,dateSpec:{kind:'day',iso:'2025-03-08'},category:'Utenze',recurrence:{kind:'single'},notify:false,note:''}
            ];s.history=[
              {id:'m1',entryId:'m-done-income-1',type:'income',name:'Fattura n. 123/2025',amount:1200,date:'2025-03-14',month:'2025-03',category:'Lavoro',note:''},
              {id:'m2',entryId:'m-done-expense-1',type:'expense',name:'Fornitore Alpha Srl',amount:350,date:'2025-03-12',month:'2025-03',category:'Servizi',note:''},
              {id:'m3',entryId:'m-done-income-2',type:'income',name:'Cliente Bianchi',amount:150,date:'2025-03-03',month:'2025-03',category:'Lavoro',note:''},
              {id:'m4',entryId:'m-done-expense-2',type:'expense',name:'Spese utenze',amount:195,date:'2025-03-01',month:'2025-03',category:'Utenze',note:''}
            ];localStorage.setItem(k,JSON.stringify(s))});
            await page.clock.setFixedTime(new Date('2025-03-13T12:00:00.000Z'));await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');
            await page.click('#homeAllMovements');await page.waitForSelector('#movements:not(.hidden)');await shot('10-movimenti');
            const summaryState=await page.evaluate(raw=>{const k='inOrdineContiV1',s=JSON.parse(raw);s.balance=1577;s.history=s.history.filter(h=>['h1','h3','h4','h7','h8'].includes(h.id));const interest=s.history.find(h=>h.id==='h8');interest.amount=365;interest.category='Interessi';const refund=s.entries.find(e=>e.id==='i2');if(refund)refund.amount=320;const utilities=s.entries.find(e=>e.id==='e2');if(utilities)utilities.amount=217.5;s.entries=s.entries.filter(e=>e.id!=='e4');const supplier=s.history.find(h=>h.id==='h3');supplier.category='Servizi';const utility=s.history.find(h=>h.id==='h4');utility.amount=217.5;utility.category='Utenze';s.history.push({id:'summary-rent-paid',entryId:'e3',type:'expense',name:'Affitto',amount:750,date:'2026-10-06',month:'2026-10',occurrenceMonth:'2026-10',occurrenceKey:'2026-10',category:'Affitto',note:''});return JSON.stringify(s)},octoberState);
            await page.evaluate(raw=>localStorage.setItem('inOrdineContiV1',raw),summaryState);await page.clock.setFixedTime(new Date('2026-10-06T12:00:00.000Z'));await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');
            await page.click('#homeProjection');await page.waitForSelector('#summary:not(.hidden)');await shot('11-riepilogo');
            await page.click('#manageBudget');await page.waitForSelector('#budget:not(.hidden)');await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k)),ym='2026-10';s.history=s.history.filter(h=>h.type==='income').concat([
              {id:'budget-utenze',entryId:'budget-utenze',type:'expense',name:'Utenze',amount:128.5,date:ym+'-02',month:ym,category:'Utenze',note:''},
              {id:'budget-affitto',entryId:'budget-affitto',type:'expense',name:'Affitto',amount:750,date:ym+'-03',month:ym,category:'Affitto',note:''},
              {id:'budget-servizi',entryId:'budget-servizi',type:'expense',name:'Servizi',amount:450,date:ym+'-04',month:ym,category:'Servizi',note:''},
              {id:'budget-spesa',entryId:'budget-spesa',type:'expense',name:'Spesa',amount:320,date:ym+'-05',month:ym,category:'Spesa',note:''},
              {id:'budget-trasporti',entryId:'budget-trasporti',type:'expense',name:'Trasporti',amount:95,date:ym+'-06',month:ym,category:'Trasporti',note:''},
              {id:'budget-svago',entryId:'budget-svago',type:'expense',name:'Svago',amount:180,date:ym+'-07',month:ym,category:'Svago',note:''}
            ]);const limits={Utenze:150,Affitto:750,Servizi:400,Spesa:500,Trasporti:200,Svago:300};s.budgetPlans=[{effectiveMonth:ym,total:0,limits}];s.budgets=limits;localStorage.setItem(k,JSON.stringify(s))});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingConti');await page.waitForSelector('#home:not(.hidden)');await page.click('#homeProjection');await page.waitForSelector('#summary:not(.hidden)');await page.click('#manageBudget');await page.waitForSelector('#budget:not(.hidden)');await shot('12-budget');
            await page.click('#budgetBack');await page.click('#summaryBack');await page.waitForSelector('#home:not(.hidden)');await page.click('#homeSettingsCard');await page.waitForSelector('#settings:not(.hidden)');await shot('13-impostazioni-conti');
            await page.click('#settingsNotifications');await page.waitForSelector('#notifications:not(.hidden)');await shot('14-notifiche-conti');
            await page.click('#notificationsBack');await page.waitForSelector('#settings:not(.hidden)');await page.click('#settingsBack');await page.waitForSelector('#home:not(.hidden)');await page.click('#homeBackLanding');await page.waitForSelector('#landing:not(.hidden)');

            await page.clock.setFixedTime(new Date('2025-03-14T12:00:00.000Z'));await page.click('#landingTodo');await page.waitForSelector('#todoSetup:not(.hidden)');
            const todoRows=page.locator('#todoSetupRows .todoSetupRow');
            const todoSamples=[
              ['Pagare bolletta luce','14 marzo 2025 una volta'],
              ['Prenotare visita medica','18 marzo 2025 una volta'],
              ['Fare revisione auto','21 marzo 2025 una volta'],
              ['Inviare documenti E.D.S.','24 marzo 2025 una volta']
            ];
            for(let i=0;i<todoSamples.length;i++){
              const row=todoRows.nth(i);await row.locator('.todoDescInput').fill(todoSamples[i][0]);await row.locator('.todoDateInput').fill(todoSamples[i][1]);
            }
            await page.evaluate(()=>{document.activeElement.blur();[...document.querySelectorAll('#todoSetupRows .todoSetupRow')].forEach((r,i)=>{if(i===0||i===1||i===3){r.dataset.notify='true';r.querySelector('.todoNotifyToggle').classList.add('on')}})});await shot('15-todo-inserimento');
            await page.click('#todoSetupSave');await page.waitForSelector('#todoHub:not(.hidden)');
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k)),t=s.todo,more=[['Rinnovare documento','2025-03-15'],['Consegnare bollette','2025-03-25'],['Organizzare cartelle','2025-03-26'],['Prenotare tagliando','2025-03-27'],['Comprare medicine','2025-03-28'],['Inviare preventivo','2025-03-29'],['Pagare assicurazione','2025-03-30'],['Fare spesa','2025-03-31'],['Chiamare il commercialista','2025-04-01'],['Rinnovare abbonamento','2025-04-02']];for(const [i,x] of more.entries())t.tasks.push({id:'visual-'+i,description:x[0],date:x[1],dateText:x[1],scheduleText:x[1],precise:true,dateSpec:{kind:'day',iso:x[1]},recurrence:{kind:'single'},notify:false,notifyRule:null,createdAt:Date.now()+i});for(const x of t.tasks.slice(0,5))x.notify=true;t.done=['Fare la spesa','Pulire la casa','Portare a spasso il cane','Leggere un libro'].map((description,i)=>({id:'done-'+i,taskId:'done-'+i,description,date:'2025-03-14',dateText:'Oggi, 09:15',scheduleText:'Oggi, 09:15',completedAt:'2025-03-14',completedTs:Date.now()+i}));t.notifications.enabled=true;t.notifications.dailySummary=true;localStorage.setItem(k,JSON.stringify(s))});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingTodo');await page.waitForSelector('#todoHub:not(.hidden)');await shot('16-todo-home');
            await page.click('#todoHubPending');await page.waitForSelector('#todoActive:not(.hidden)');await shot('17-todo-in-scadenza');
            await page.locator('.todoCompleteBtn').first().click();await page.click('#todoGoDone');await page.waitForSelector('#todoDone:not(.hidden)');await page.waitForSelector('#undoSnack',{state:'hidden'});
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.todo.done=['Fare la spesa','Pulire la casa','Portare a spasso il cane','Leggere un libro','Fare attività fisica','Organizzare la settimana'].map((description,i)=>({id:'approved-done-'+i,taskId:'approved-done-'+i,description,date:'2025-03-'+String(14+i).padStart(2,'0'),dateText:i<2?'Oggi, 09:15':i<4?'Ieri, 18:30':'5 mar 2025, 12:10',scheduleText:i<2?'Oggi, 09:15':i<4?'Ieri, 18:30':'5 mar 2025, 12:10',completedAt:'2025-03-14',completedTs:Date.now()+5-i}));localStorage.setItem(k,JSON.stringify(s))});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingTodo');await page.waitForSelector('#todoHub:not(.hidden)');await page.click('#todoHubDone');await page.waitForSelector('#todoDone:not(.hidden)');await shot('18-todo-cose-gia-fatte');
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.todo.tasks=[['Medicinali','Oggi, 09:00'],['Visita medica','Ieri, 16:30'],['Documento','12 Apr 2025, 10:00']].map((x,i)=>({id:'recent-'+i,description:x[0],date:'2025-03-14',dateText:x[1],scheduleText:x[1],notify:true,createdAt:i}));s.todo.notifications.enabled=true;s.todo.notifications.dailySummary=true;localStorage.setItem(k,JSON.stringify(s))});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingTodo');await page.waitForSelector('#todoHub:not(.hidden)');await page.click('#todoHubDone');await page.waitForSelector('#todoDone:not(.hidden)');await page.click('#todoDoneSettings');await page.waitForSelector('#todoSettings:not(.hidden)');
            await page.click('#todoSettingNotifications');await page.waitForSelector('#modal:not(.hidden)');await shot('19-todo-notifiche');await page.click('#modalClose');
            await shot('20-todo-impostazioni');
            await page.click('#todoSettingTheme');await page.waitForSelector('#modal:not(.hidden)');await page.click('[data-ttheme="light"]');await shot('21-todo-tema');await page.click('#modalClose');
            await page.click('#todoSettingColor');await page.waitForSelector('#modal:not(.hidden)');await shot('22-todo-colore');await page.click('#modalClose');
            await page.evaluate(()=>{localStorage.setItem('inOrdineContiV1_backup_last','2025-03-12T18:42:00.000Z');const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.backup.auto=true;localStorage.setItem(k,JSON.stringify(s))});await page.click('#todoSettingBackup');await page.waitForSelector('#modal:not(.hidden)');await page.check('#backupAuto');await page.evaluate(()=>localStorage.setItem('inOrdineContiV1_backup_last','2025-03-12T18:42:00.000Z'));console.log('TODO_BACKUP_DIAG',JSON.stringify(await page.evaluate(()=>({title:document.querySelector('#modalTitle')?.textContent,body:document.querySelector('#modalBody')?.innerText,html:document.querySelector('#modalBody')?.innerHTML,details:Array.from(document.querySelectorAll('#modalBody details')).map(d=>({id:d.id,open:d.open}))}))));await shot('23-todo-backup');await page.click('#modalClose');
            await page.evaluate(()=>{const k='inOrdineContiV1',s=JSON.parse(localStorage.getItem(k));s.security.enabled=true;s.security.pinHash='visual-fixture';s.security.credentialId='visual-biometric-fixture';s.security.hideHomeAmounts=true;s.security.lockMinutes=1;localStorage.setItem(k,JSON.stringify(s))});await page.reload();await page.waitForSelector('#landing:not(.hidden)');await page.click('#landingTodo');await page.waitForSelector('#todoHub:not(.hidden)');await page.click('#todoHubDone');await page.waitForSelector('#todoDone:not(.hidden)');await page.click('#todoDoneSettings');await page.waitForSelector('#todoSettings:not(.hidden)');await page.click('#todoSettingPrivacy');await page.waitForSelector('#modal:not(.hidden)');await shot('24-todo-privacy');await page.click('#modalClose');

            const files=require('fs').readdirSync('visual').filter(f=>f.endsWith('.png'));
            if(files.length!==24)throw new Error('Visual review deve contenere esattamente 24 screenshot runtime, trovati: '+files.length);
            const firstPng=require('fs').readFileSync('visual/01-in-ordine.png');
            if(firstPng.readUInt32BE(16)!==941||firstPng.readUInt32BE(20)!==1672)throw new Error('La cattura deve usare la stessa risoluzione dei master: 941x1672 px');
            if(files.some(f=>f.includes('-master')))throw new Error('Non sono ammessi file master come sostituti degli screenshot runtime');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: in-ordine-visual-review
          path: visual/*.png
          if-no-files-found: error
