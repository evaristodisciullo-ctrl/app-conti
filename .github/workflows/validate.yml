name: Validate app
on:
  push:
    branches: [main, rebuild-conti-economici, visual-allineamento-grafiche]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html)
          inline = [x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("inline script not found")
          Path("/tmp/app.js").write_text("\n".join(inline), encoding="utf-8")
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
      - name: Verify no calendar date inputs
        run: |
          if grep -Eq 'type=["'"'"'](date|month)["'"'"']' index.html; then
            echo "Calendar date input found"
            exit 1
          fi
