name: Validate V2 app
on:
  push:
    branches: [rebuild/v2-clean-android]
  pull_request:
    branches: [rebuild/v2-clean-android]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:v2
      - run: npm run validate:v2
      - run: npx cap sync android
